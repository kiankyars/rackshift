[project]
name = "rackshift"
version = "0.1.0"
description = "Keep an AI-infrastructure design valid when GPU-rack power specs change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.13,<2"]
dev = ["pytest>=8.3"]

[project.scripts]
rackshift = "rackshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
